<div *ngIf="isRole()">
</div>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


  <body>

    <div class="container-fluid">
      <div class="row">
        <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
          <div class="position-sticky pt-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link" href="#" routerLink="scheduled">
                  <span data-feather="orders"></span>
                  Scheduled Wash
                </a>
              </li>

            </ul>
          </div>
        </nav>
        <div class="col-sm-10 main">

          <h2 class="sub-header">Previous Order Accepted</h2>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead class="thead-dark">
                <tr>
                  <th>Customer Name</th>
                  <th>Phone Number</th>
                  <th>Status</th>
                  <th>Payment Status</th>
                  <th>Total Cost</th>
                  <th>Action</th>

                </tr>
              </thead>
              <tbody>
                <tr  *ngFor="let item of requests">
                  <td>{{item.customerName}}</td>
                  <td>{{item.phoneNumber}}</td>
                  <td>{{item.status}}</td>
                  <td>{{item.paymentStatus}}</td>
                  <td>{{item.totalCost}}</td>
                  <td><button class="btn btn-secondary" routerLink="orderDetails" (click)="populate(item)">View Order Details</button>
                    <button class="btn btn-secondary" id="rating" (click)="populate(item)" routerLink="rating" >Rate Wash</button>
                  </td>


                </tr>

              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>


  </body>
