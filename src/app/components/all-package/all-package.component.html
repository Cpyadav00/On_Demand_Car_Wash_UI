
<body>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <div class="container-fluid">
    <div class="row">
<app-admin-side-bar></app-admin-side-bar>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <h2 class="sub-header text-center">All Services Available</h2>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead class="thead-dark">
              <tr>
                <th scope="col">Id</th>
                <th scope="col">Name</th>
                <th scope="col">Description</th>
                <th scope="col">Price</th>
                <th scope="col">Status</th>
                <th scope="col" colspan="2">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of pagedPackages">
                <td scope="row">{{item.id}}</td>
                <td scope="row">{{item.name}}</td>
                <td>{{item.description}}</td>
                <td>{{item.price}}</td>
                <td>{{item.status}}</td>
                <td>
                  <button type="button" class="btn btn-secondary mb-2" (click)="populatePackage(item)" routerLink="update">Update</button>
                </td>
                <td>
                  <button type="button" class="btn btn-secondary mb-2" (click)="deletePackage(item.id)">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div style="text-align: right; margin-top: 10px;">
          <button type="button" class="btn btn-secondary" routerLink="form">Add New</button>
        </div>

        <nav aria-label="Pagination">
          <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link"  (click)="changePage(1)">First</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link"  (click)="changePage(currentPage - 1)">Previous</a>
            </li>
            <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
              <a class="page-link"  (click)="changePage(page)">{{page}}</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link"  (click)="changePage(currentPage + 1)">Next</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link"  (click)="changePage(totalPages)">Last</a>
            </li>
          </ul>
        </nav>
      </main>
    </div>
  </div>
</body>
