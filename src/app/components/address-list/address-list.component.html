<body>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <div class="container-fluid">
    <div class="row">
<app-admin-side-bar></app-admin-side-bar>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

        <div class="table-responsive">
          <h2 class="sub-header text-center">All Address Details</h2>
          <table class="table table-striped">
            <thead class="thead-dark">
              <tr>
                <th scope="col">UserId</th>
                <th scope="col">Customer Address</th>
                <th scope="col">City</th>
                <th scope="col">State</th>
                <th scope="col">Pincode</th>
                <!-- <th scope="col">Action</th> -->
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of pagedUsers">
                <th scope="row">{{item.id}}</th>
                <th scope="row">{{item.custAddress}}</th>
                <td>{{item.city}}</td>
                <td>{{item.state}}</td>
                <td>{{item.pincode}}</td>

                <!-- <td> -->
                  <!-- <button type="button" class="btn btn-secondary" (click)="deletingUser(item.userId)">Delete</button> -->
                <!-- </td> -->
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-container">
          <nav aria-label="Pagination">
            <ul class="pagination justify-content-center">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link"  (click)="changePage(1)">First</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link"  (click)="changePage(currentPage - 1)">Previous</a>
              </li>
              <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
                <a class="page-link"  (click)="changePage(page)">{{page}}</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link"  (click)="changePage(currentPage + 1)">Next</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link"  (click)="changePage(totalPages)">Last</a>
              </li>
            </ul>
          </nav>
        </div>

      </main>
    </div>
  </div>
</body>
