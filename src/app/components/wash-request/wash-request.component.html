
<div>
  <table class="table">
    <thead class="thead">
      <tr>
        <th scope="col">Id</th>
        <th scope="col">Name</th>
        <th scope="col">Discription</th>
        <th scope="col">Price</th>
        <th scope="col">Status</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of order">
        <th scope="row">{{item.id}}</th>
        <th scope="row">{{item.id}}</th>
        <th scope="row">{{item.id}}</th>
        <th scope="row">{{item.id}}</th>
        <th scope="row">{{item.id}}</th>

       <td>
        <button type="button" class="btn btn-secondary mb-2" (click)="updateData(item.id)" routerLink="form">Approve</button>
        </td>
      </tr>
    </tbody>
  </table>

 </div>
