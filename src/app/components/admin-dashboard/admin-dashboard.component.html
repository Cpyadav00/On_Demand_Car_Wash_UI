<body *ngIf="isRole()">


  <div class="container-fluid">
    <div class="row">
      <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
        <div class="position-sticky pt-3">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">
                <span data-feather="home"></span>
                Admin Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <span data-feather="orders"></span>
                Orders
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" routerLink="services">
                <span data-feather="servives"></span>
                Services
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <span data-feather="customer"></span>
                Customers
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <span data-feather="washers"></span>
                Washers
              </a>
            </li>
          </ul>
        </div>
      </nav>

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Admin Dashboard
          </h1>

          <h1>Welcome, {{fullNames}}</h1>
           </div>
          <div>
          <table class="table">
            <thead class="thead">
              <tr>
                <th scope="col">UserId</th>
                <th scope="col">User Name</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Role</th>
                <th scope="col">Status</th>
                <th scope="col">Button</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of users">
                <th scope="row">{{item.userId}}</th>
                <th scope="row">{{item.email}}</th>
                <td>{{item.firstName}}</td>
                <td>{{item.lastName}}</td>
                <td>{{item.role}}</td>
                <td>{{item.status}}</td>

               <td>
                <button type="button" class="btn btn-outline-secondary"  (click)="deletingUser(item.userId)">Delete</button>
                </td>
              </tr>
            </tbody>
          </table>

         </div>


      </main>
    </div>
  </div>
</body>
