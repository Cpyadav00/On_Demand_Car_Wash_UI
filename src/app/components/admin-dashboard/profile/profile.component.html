<body>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <div class="container-fluid">
    <div class="row">
      <app-admin-side-bar></app-admin-side-bar>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="container">
          <h1>User Profile</h1>
          <form #userProfileForm="ngForm" (ngSubmit)="saveProfile(userProfileForm)">

            <div>
              <input hidden="true"
                     name="id"
                     id="id"
                     [(ngModel)]="userProfile.id"
                     />
            </div>


            <div class="form-row profile-photo">
              <div class="form-group col-md-12">
                <img src="\assets\userIcon.png" alt="Profile Photo" class="img-fluid rounded-circle">
                <br>
                <button type="button" class="btn btn-secondary mt-2">Edit Photo</button>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="firstName">First Name</label>
                <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter your first name" [(ngModel)]="userProfile.firstName" [disabled]="!editMode" required>
              </div>
              <div class="form-group col-md-6">
                <label for="lastName">Last Name</label>
                <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter your last name" [(ngModel)]="userProfile.lastName" [disabled]="!editMode" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" [(ngModel)]="userProfile.phoneNumber" [disabled]="!editMode" required>
              </div>
              <div class="form-group col-md-6">
                <label for="permanentAddress">Address</label>
                <input type="text" class="form-control" id="permanentAddress" name="permanentAddress" placeholder="Enter your address" [(ngModel)]="userProfile.permanentAddress" [disabled]="!editMode" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your Email" [(ngModel)]="userProfile.email" [disabled]="!editMode" required>
              </div>
              <div class="form-group col-md-6">
                <label for="role">Role</label>
                <input type="text" class="form-control" id="role" name="role" [(ngModel)]="userProfile.role" [disabled]="!editMode" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="age">Age</label>
                <input type="number" class="form-control" id="age" name="age" placeholder="Enter your age" [(ngModel)]="userProfile.age" [disabled]="!editMode" required>
              </div>
              <div class="form-group col-md-6">
                <label for="gender">Gender</label>
                <select class="form-control" id="gender" name="gender" [(ngModel)]="userProfile.gender" [disabled]="!editMode" required>
                  <option value="">Select your gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <div class="text-center">
              <ng-template [ngIf]="!editMode" [ngIfElse]="editButtons">
                <button type="button" class="btn btn-primary" (click)="editMode = true">Edit</button>
              </ng-template>
              <ng-template #editButtons>
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-secondary" *ngIf="editMode" (click)="cancelEdit()">Cancel</button>
              </ng-template>
            </div>

          </form>

        </div>
      </main>
    </div>
  </div>
</body>
